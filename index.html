<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Jugg</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="screensaver" class="hidden">
  <img src="assets/juggernaut.png" alt="JUGGERNAUT">
</div>

  <div class="arcade-layout">
    
    <aside class="ad-banner">
      <img src="assets/ad-left.png" alt="Ad Space" onerror="this.style.display='none'">
    </aside>

    <main>
      <h1>Flappy Jugg</h1>
      <p class="hint">Click / tap / space to flap, press R to restart</p>

      <div class="game-container">
        <canvas id="game" width="480" height="640"></canvas>
        <div class="hud">
          <span id="score">0</span>
        </div>
      </div>
    </main>

    <aside class="ad-banner">
      <img src="assets/ad-right.png" alt="Ad Space" onerror="this.style.display='none'">
    </aside>

  </div>

  <script src="main.js"></script>
</body>
</html>
